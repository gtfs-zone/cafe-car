name: Build

# Lints and tests, then builds the image and pushes it to
# ghcr.io/<owner>/<repo> tagged with the short SHA, latest, and the tag on v*.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # uv fetches its own interpreter when the runner's python does not match
      # requires-python.
      - name: Install project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Not every repo has a test suite yet.
      - name: Test
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "no tests/ directory, skipping"
          fi

      - name: Image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA::7}"
          TAGS="$IMAGE:$SHA,$IMAGE:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS,$IMAGE:$GITHUB_REF_NAME"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
