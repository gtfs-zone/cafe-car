services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@db:5432/postgres
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@db:5432/postgres
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    build: .
    restart: on-failure
    command: fastapi run src/app/admin_main.py --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@db:5432/postgres
      REDIS_URL: redis://redis:6379/1
      SESSION_SECRET_KEY: dev-secret-key
      DEV_AUTH_USER: devuser
      DEV_AUTH_EMAIL: dev@local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  redis_data:
