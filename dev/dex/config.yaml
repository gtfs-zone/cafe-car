issuer: http://dex:5556

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  responseTypes:
    - code
  skipApprovalScreen: true

staticClients:
  - id: oauth2-proxy
    secret: dev-oauth2-proxy-secret
    redirectURIs:
      - http://localhost:4180/oauth2/callback
    name: oauth2-proxy

enablePasswordDB: true
