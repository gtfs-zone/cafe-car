mqtt {
    allow_anonymous = false
}

auth {
    http_auth {
        enable = true

        auth_req {
            url = "http://api:8000/mqtt/auth"
            method = "POST"
            headers.content-type = "application/x-www-form-urlencoded"
            params = {username = "%u", password = "%P"}
        }

        acl_req {
            url = "http://api:8000/mqtt/acl"
            method = "POST"
            headers.content-type = "application/x-www-form-urlencoded"
            params = {username = "%u", topic = "%t", access = "%A"}
        }
    }
}
