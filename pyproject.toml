[project]
name = "gtfs-zone-rt-api"
version = "0.2.1"
requires-python = ">=3.13"
description = "Core API for GTFS.Zone: serves GTFS-RT protobuf feeds and provides an admin UI"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    # Starlette's SessionMiddleware signs the cookie with it
    "itsdangerous>=2.2",
    "asyncpg",
    "redis[asyncio]",
    "pydantic-settings",
    "gtfs-realtime-bindings>=2.2.0",
    "celery[redis]",
    "httpx",
    "segno",
    "gtfs-zone-db-models",
    "sqlalchemy>=2",
    "pydantic>=2",
    "starlette>=0.52.1",
]

[tool.uv.sources]
gtfs-zone-db-models = { git = "https://github.com/gtfs-zone/gtfs-zone-db-models.git", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "commitizen",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "aiosqlite>=0.22.1",
    "vulture>=2.16",
    "deptry>=0.25.1",
]

[project.scripts]
# Dev fixture, guarded by DEBUG. See src/gtfs_zone_rt_api/seed_dev.py.
rt-api-seed-dev = "gtfs_zone_rt_api.seed_dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_rt_api"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/gtfs_zone_rt_api/__init__.py" = ["F401"]
# Tests take fixtures by name and return nothing worth annotating.
"tests/**" = ["ANN"]
# One-off debug and simulation scripts, not shipped in the wheel.
"scripts/**" = ["ANN", "E501"]
# FastAPI resolves annotations at runtime to build dependencies and response
# models, so a type-only import there is a NameError, not a saving. TC0xx has
# to be off for the whole API package rather than silenced per line.
"src/gtfs_zone_rt_api/api/*.py" = ["TC001", "TC002", "TC003"]

[tool.vulture]
paths = ["src", "scripts"]
exclude = ["*/alembic/versions/*"]
# Used only through a framework: routes, validators, tasks, ORM fields
ignore_decorators = ["@app.*", "@router.*", "@field_validator", "@model_validator"]
ignore_names = [
    "cls",
    "model_config",
    # Starlette middleware and http.server handler hooks
    "dispatch",
    "do_GET",
    "log_message",
    "format",
    # Response and request model fields, read by pydantic
    "account_url",
    "arrival_delay",
    "arrival_time",
    "can_manage",
    "departure_delay",
    "departure_time",
    "has_alerts",
    "has_trip_updates",
    "has_vehicles",
    "hosted_url",
    "is_current",
    "is_owner",
    "load",
    "owner_name",
    "service_alerts_url",
    "static_url",
    "trip_updates_url",
    "vehicle_positions_url",
]

[tool.deptry]
per_rule_ignores.DEP002 = [
    "asyncpg",  # SQLAlchemy driver, loaded from the database URL
    "itsdangerous",  # imported by Starlette's SessionMiddleware
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
annotated_tag = true
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # SQLModel nags on every `session.execute()`, suggesting `session.exec()`.
    # The application uses `execute()` throughout deliberately (it returns Row
    # objects the scoped queries want), so the nag is pure noise that would
    # bury a warning worth reading.
    # (?s) so `.` spans the message's newlines, since it is a multi-line banner.
    "ignore:(?s).*You probably want to use `session.exec\\(\\)`.*:DeprecationWarning",
]
