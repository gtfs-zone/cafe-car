[project]
name = "gtfs-zone-rt-api"
version = "0.2.1"
requires-python = ">=3.13"
description = "Core API for GTFS.Zone: serves GTFS-RT protobuf feeds and provides an admin UI"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    # SQLAdmin's own views are gone; `admin/auth.py`'s OIDCAuthBackend still
    # subclasses sqladmin.authentication.AuthenticationBackend, unused but not
    # yet removed. Drop this once that class goes too.
    "sqladmin[full]==0.23.0",
    "asyncpg",
    "redis[asyncio]",
    "pydantic-settings",
    "gtfs-realtime-bindings>=2.2.0",
    "celery[redis]",
    "httpx",
    "segno",
    "gtfs-zone-db-models",
]

[tool.uv.sources]
gtfs-zone-db-models = { git = "https://github.com/gtfs-zone/gtfs-zone-db-models.git", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "aiosqlite>=0.22.1",
]

[project.scripts]
# Dev fixture, guarded by DEBUG. See src/gtfs_zone_rt_api/seed_dev.py.
rt-api-seed-dev = "gtfs_zone_rt_api.seed_dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_rt_api"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/gtfs_zone_rt_api/__init__.py" = ["F401"]
# Tests take fixtures by name and return nothing worth annotating.
"tests/**" = ["ANN"]
# One-off debug and simulation scripts, not shipped in the wheel.
"scripts/**" = ["ANN", "E501"]
# FastAPI resolves annotations at runtime to build dependencies and response
# models, so a type-only import there is a NameError, not a saving. TC0xx has
# to be off for the whole API package rather than silenced per line.
"src/gtfs_zone_rt_api/api/*.py" = ["TC001", "TC002", "TC003"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
annotated_tag = true
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # SQLModel nags on every `session.execute()`, suggesting `session.exec()`.
    # The application uses `execute()` throughout deliberately (it returns Row
    # objects the scoped queries want), so the nag is pure noise that would
    # bury a warning worth reading.
    # (?s) so `.` spans the message's newlines, since it is a multi-line banner.
    "ignore:(?s).*You probably want to use `session.exec\\(\\)`.*:DeprecationWarning",
]
