[project]
name = "redis-gtfs-rt-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "sqladmin[full]",
    "asyncpg",
    "alembic",
    "redis[asyncio]",
    "pydantic-settings",
    "gtfs-realtime-bindings>=2.0.0",
]

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
