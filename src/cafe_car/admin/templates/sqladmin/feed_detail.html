{% extends "sqladmin/details.html" %}
{% block content %}
{{ super() }}
<div class="col-12">
  <div class="card mt-3">
    <div class="card-header"><h3 class="card-title">People</h3></div>
    <div class="card-body">
      <div hx-get="/feeds/{{ model.id }}/members-partial"
           hx-trigger="load"
           hx-swap="outerHTML">
        <p class="text-muted">Loading&hellip;</p>
      </div>
    </div>
  </div>
</div>
<div class="col-12">
  <div class="card mt-3">
    <div class="card-header"><h3 class="card-title">Open in&hellip;</h3></div>
    <div class="card-body">
      <a href="{{ viz_url(model) }}" target="_blank" rel="noopener noreferrer"
         class="btn btn-primary me-2">
        Open in viz &#8599;
      </a>
      {% set edit_href = editor_url(model) %}
      {% if edit_href %}
      <a href="{{ edit_href }}" target="_blank" rel="noopener noreferrer"
         class="btn btn-secondary">
        Open in editor &#8599;
      </a>
      {% else %}
      <button class="btn btn-secondary" disabled
              title="This feed has no static URL to load">
        Open in editor &#8599;
      </button>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
