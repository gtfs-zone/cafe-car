<div>
  <p class="text-muted">
    Scan this QR with the Traccar Client app to configure tracker
    <strong>{{ nickname }}</strong> in one step, or copy the config URL below.
  </p>
  <p class="text-muted">
    Tracker ID (secret credential, do not share):
    <code>{{ tracker_id }}</code>
  </p>
  <div style="max-width:240px">{{ qr_svg | safe }}</div>
  <div class="mt-3">
    <label class="form-label">Config URL</label>
    <div class="input-group">
      <input id="traccar-config-url" type="text" class="form-control"
             value="{{ config_url }}" readonly>
      <button class="btn btn-outline-secondary" type="button"
              onclick="navigator.clipboard.writeText(document.getElementById('traccar-config-url').value)">
        Copy
      </button>
    </div>
    <small class="text-muted">
      The base host must be reachable from the driver's phone (not
      <code>localhost</code>) in a real deployment.
    </small>
  </div>
</div>
